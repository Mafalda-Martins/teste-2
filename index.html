<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>👩‍💼 Corporate Survivor</title>

<style>

body{
    margin:0;
    background:linear-gradient(to bottom,#87CEEB,#EAF7FF);
    overflow:hidden;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:10px;
}

#score{
    font-size:28px;
    font-weight:bold;
}

#game{
    width:1000px;
    height:400px;
    margin:auto;
    border-bottom:5px solid #333;
    position:relative;
    overflow:hidden;
}

#player{
    position:absolute;
    left:80px;
    bottom:0;
    font-size:70px;
}

.jump{
    animation:jump 0.7s;
}

@keyframes jump{
    0%{bottom:0;}
    50%{bottom:180px;}
    100%{bottom:0;}
}

.obstacle{
    position:absolute;
    right:-80px;
    bottom:0;
    font-size:60px;
}

.cloud{
    position:absolute;
    top:30px;
    font-size:50px;
    animation:cloudMove 20s linear infinite;
}

@keyframes cloudMove{
    from{left:100%;}
    to{left:-200px;}
}

</style>

</head>

<body>

<h1>👩‍💼 Corporate Survivor</h1>

<p>
Salta reuniões 📅, emails 📧, bugs 🐞 e urgências 🔥!
</p>

<div id="score">Pontuação: 0</div>

<div id="game">

    <div class="cloud">☁️</div>

    <div id="player">👩‍💼</div>

</div>

        player.classList.add("jump");

        setTimeout(()=>{
            player.classList.remove("jump");
        },700);
    }
});
