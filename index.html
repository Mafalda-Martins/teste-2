<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>☕ Coffee Run</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#87CEEB,#dff4ff);
}

h1{
    margin:10px 0;
}

#score{
    font-size:28px;
    font-weight:bold;
}

#game{
    width:1000px;
    height:400px;
    margin:auto;
    position:relative;
    overflow:hidden;
    border-bottom:5px solid #333;
}

#player{
    position:absolute;
    left:80px;
    bottom:0;
    font-size:70px;
}

.jump{
    animation:jump 0.7s linear;
}

@keyframes jump{
    0%{bottom:0;}
    50%{bottom:180px;}
    100%{bottom:0;}
}

.item{
    position:absolute;
    right:-100px;
    bottom:0;
    font-size:60px;
}
</style>
</head>

<body>

<h1>☕ Coffee Run</h1>
<p>Apanha cafés ☕ e evita reuniões 📅</p>

<div id="score">Pontos: 0</div>

<div id="game">
    <div id="player">🏃‍♀️</div>
</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreBox = document.getElementById("score");

let score = 0;

document.addEventListener("keydown", (e)=>{

    if(e.code==="Space"){

        if(!player.classList.contains("jump")){

            player.classList.add("jump");

            setTimeout(()=>{
                player.classList.remove("jump");
            },700);
        }
    }
});

function spawn(){

    let obj=document.createElement("div");

    obj.classList.add("item");

    let isCoffee=Math.random()>0.5;

    obj.innerHTML=isCoffee ? "☕" : "📅";

    game.appendChild(obj);

    let pos=-100;

    let move=setInterval(()=>{

        pos+=12;

        obj.style.right=pos+"px";

        let playerHeight=
            parseInt(getComputedStyle(player).bottom);

        if(pos>820 && pos<900){

            if(playerHeight<50){

                if(isCoffee){

                    score+=5;

                }else{

                    alert(
                        "📅 Foste para mais uma reunião!\n\nPontos: "+score
                    );

                    location.reload();
                }

                scoreBox.innerHTML="Pontos: "+score;

                obj.remove();

                clearInterval(move);
            }
        }

        if(pos>1200){

            obj.remove();
            clearInterval(move);
        }

    },20);
}

setInterval(spawn,1200);

</script>

</body>
</html>
